<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dell SPL Lookup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { margin-bottom: 20px; }
        h2 { margin-bottom: 10px; }

        .search-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-form input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 2px solid #ccc; border-radius: 6px; }
        .search-form input[type="text"]:focus { outline: none; border-color: #0076ce; }
        .search-form button { padding: 10px 24px; font-size: 16px; background: #0076ce; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .search-form button:hover { background: #005ea5; }
        .search-form button:disabled { background: #999; cursor: not-allowed; }

        .error { color: #c0392b; margin-bottom: 20px; }
        .result-count { color: #666; margin-bottom: 15px; font-size: 14px; }
        .loading { color: #666; font-style: italic; margin-bottom: 20px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e0e0e0; }
        th { background: #f5f5f5; font-weight: 600; position: sticky; top: 0; }
        tr:hover td { background: #f0f7ff; }

        .status-active { color: #198754; font-weight: 500; }
        .status-inactive { color: #999; }
        .price { white-space: nowrap; }
        .specs { font-size: 12px; color: #666; }

        a { color: #0076ce; text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }

        .no-results { color: #888; font-style: italic; }

        /* Detail view */
        .back { display: inline-block; margin-bottom: 20px; font-size: 14px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .info-card { background: #f8f9fa; border-radius: 8px; padding: 20px; }
        .info-card h2 { font-size: 14px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; margin-bottom: 12px; }

        .field { margin-bottom: 8px; }
        .field-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; }
        .field-value { font-size: 15px; }
        .field-value.large { font-size: 24px; font-weight: 600; }

        .specs-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        .specs-table th, .specs-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e0e0e0; }
        .specs-table th { background: #f5f5f5; font-weight: 600; width: 200px; }
        .specs-table tr:hover td { background: #f9f9f9; }

        .long-desc { font-size: 13px; color: #555; line-height: 1.6; margin-top: 5px; }

        .quote-box { background: #eef6ff; border: 2px solid #0076ce; border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; }
        .quote-box h2 { font-size: 14px; text-transform: uppercase; color: #0076ce; letter-spacing: 0.5px; margin-bottom: 8px; }
        .quote-row { display: flex; gap: 10px; align-items: center; }
        .quote-text { flex: 1; font-size: 14px; line-height: 1.5; font-family: monospace; word-break: break-word; }
        .copy-btn { padding: 6px 16px; font-size: 13px; background: #0076ce; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .copy-btn:hover { background: #005ea5; }
        .copy-btn.copied { background: #198754; }

        #detail-view { display: none; }
    </style>
</head>
<body>
    <h1>Dell Standard Price List Lookup</h1>

    <div class="search-form">
        <input type="text" id="search-input" placeholder="Search by product name, SKU, model (e.g. latitude, 210-BGDU, optiplex)...">
        <button id="search-btn">Search</button>
    </div>

    <div id="search-view">
        <div id="error-msg"></div>
        <div id="loading-msg"></div>
        <div id="result-count"></div>
        <div id="results-table"></div>
    </div>

    <div id="detail-view"></div>

    <script>
    const API = "https://channel.dell.com/splapi/us/en";

    // --- Utility ---

    function escapeHtml(str) {
        if (!str) return "";
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function formatPrice(msrp) {
        if (msrp == null) return "";
        return "$" + msrp.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function buildQuoteString(product, specsDict) {
        const parts = [
            product.vpn || "",
            product.family || product.title || "",
            specsDict["Processor"] || "",
            specsDict["Memory"] || "",
            specsDict["Storage"] || "",
            specsDict["Display"] || "",
            specsDict["Operating System"] || "",
            specsDict["Standard Hardware Support Service"] || "",
        ];
        return parts.filter(Boolean).join(" / ");
    }

    function extractSpecsDict(product) {
        const dict = {};
        for (const section of (product.techSpecs?.sections || [])) {
            for (const spec of (section.specifications || [])) {
                if (spec.title && spec.value) {
                    dict[spec.title] = spec.value;
                }
            }
        }
        return dict;
    }

    function extractSpecsList(product) {
        const list = [];
        for (const section of (product.techSpecs?.sections || [])) {
            for (const spec of (section.specifications || [])) {
                if (spec.title && spec.value) {
                    list.push({ title: spec.title, value: spec.value });
                }
            }
        }
        return list;
    }

    function categoryString(product) {
        return (product.categories || []).map(c => c.categoryName || "").filter(Boolean).join(", ");
    }

    // --- API calls ---

    async function typeaheadLookup(query) {
        const url = `${API}/typeahead?query=${encodeURIComponent(query)}`;
        const resp = await fetch(url, {
            headers: { "Content-Type": "application/json" },
        });
        if (!resp.ok) throw new Error(`Typeahead request failed: ${resp.status}`);
        const data = await resp.json();

        const byType = {};
        for (const result of (data.searchResults || [])) {
            for (const item of (result.matchedItems || [])) {
                const t = item.type ?? 1;
                const pid = item.productId || "";
                if (pid) {
                    if (!byType[t]) byType[t] = [];
                    byType[t].push(pid);
                }
            }
        }

        return Object.entries(byType).map(([t, pids]) => ({
            productIds: pids,
            type: Number(t),
        }));
    }

    async function filterProducts(query, productIdsWithType) {
        const url = `${API}/filtersrefiners/filter-products`;
        const payload = {
            sortBy: [],
            filters: [],
            search: query,
            productIdsWithType: productIdsWithType,
            page: { itemsPerPage: 10, pageNumber: 0 },
        };
        const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        if (!resp.ok) throw new Error(`Filter-products request failed: ${resp.status}`);
        return resp.json();
    }

    async function fetchProductById(productId, productType) {
        productType = productType ?? 1;
        const url = `${API}/filtersrefiners/filter-products`;
        const payload = {
            sortBy: [],
            filters: [],
            search: "",
            productIdsWithType: [{ productIds: [productId], type: productType }],
            page: { itemsPerPage: 10, pageNumber: 0 },
        };
        const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        if (!resp.ok) throw new Error(`Product fetch failed: ${resp.status}`);
        return resp.json();
    }

    // --- Search ---

    async function doSearch(query) {
        const errorEl = document.getElementById("error-msg");
        const loadingEl = document.getElementById("loading-msg");
        const countEl = document.getElementById("result-count");
        const tableEl = document.getElementById("results-table");

        errorEl.innerHTML = "";
        countEl.innerHTML = "";
        tableEl.innerHTML = "";
        loadingEl.innerHTML = '<p class="loading">Searching...</p>';
        document.getElementById("search-btn").disabled = true;

        try {
            const productIds = await typeaheadLookup(query);

            if (productIds.length === 0) {
                loadingEl.innerHTML = "";
                tableEl.innerHTML = `<p class="no-results">No results found for "${escapeHtml(query)}".</p>`;
                return;
            }

            const data = await filterProducts(query, productIds);
            const productList = data.productListData || {};
            const pageInfo = productList.page || {};
            const total = pageInfo.totalItems || 0;
            const products = productList.products || [];

            loadingEl.innerHTML = "";

            if (products.length === 0) {
                tableEl.innerHTML = `<p class="no-results">No results found for "${escapeHtml(query)}".</p>`;
                return;
            }

            countEl.innerHTML = `<p class="result-count">Showing ${products.length} of ${total} results for "${escapeHtml(query)}"</p>`;
            tableEl.innerHTML = renderResultsTable(products);
        } catch (err) {
            loadingEl.innerHTML = "";
            errorEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        } finally {
            document.getElementById("search-btn").disabled = false;
        }
    }

    function renderResultsTable(products) {
        let rows = "";
        for (const p of products) {
            const specs = extractSpecsDict(p);
            const msrp = p.price?.manufacturersSuggestedRetailPrice;
            const category = categoryString(p);
            const statusClass = p.status === "Active" ? "status-active" : "status-inactive";
            const orderCode = escapeHtml(p.orderCode || "");

            let specLines = "";
            if (specs["Processor"]) specLines += `CPU: ${escapeHtml(specs["Processor"])}<br>`;
            if (specs["Memory"]) specLines += `RAM: ${escapeHtml(specs["Memory"])}<br>`;
            if (specs["Storage"]) specLines += `Storage: ${escapeHtml(specs["Storage"])}`;

            rows += `<tr>
                <td><a onclick="showDetail('${orderCode}')">${escapeHtml(p.sku || "")}</a></td>
                <td><a onclick="showDetail('${orderCode}')">${escapeHtml(p.vpn || "")}</a></td>
                <td>
                    <a onclick="showDetail('${orderCode}')"><strong>${escapeHtml(p.brand || "")}</strong></a><br>
                    <span class="specs">${escapeHtml(p.description || "")}</span>
                </td>
                <td>${escapeHtml(category)}</td>
                <td class="${statusClass}">${escapeHtml(p.status || "")}</td>
                <td class="price">${formatPrice(msrp)}</td>
                <td class="specs">${specLines}</td>
            </tr>`;
        }

        return `<table>
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>VPN</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>MSRP</th>
                    <th>Key Specs</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    // --- Detail view ---

    async function showDetail(orderCode) {
        const searchView = document.getElementById("search-view");
        const detailView = document.getElementById("detail-view");

        searchView.style.display = "none";
        detailView.style.display = "block";
        detailView.innerHTML = '<p class="loading">Loading product details...</p>';

        try {
            const data = await fetchProductById(orderCode);
            const products = data.productListData?.products || [];

            if (products.length === 0) {
                detailView.innerHTML = '<p class="error">Product not found.</p>';
                return;
            }

            detailView.innerHTML = renderDetail(products[0]);
        } catch (err) {
            detailView.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
        }
    }

    function showSearch() {
        document.getElementById("search-view").style.display = "block";
        document.getElementById("detail-view").style.display = "none";
    }

    function renderDetail(p) {
        const specs = extractSpecsDict(p);
        const specsList = extractSpecsList(p);
        const quoteString = buildQuoteString(p, specs);
        const msrp = p.price?.manufacturersSuggestedRetailPrice;
        const currency = p.price?.primaryCurrency || "";
        const category = categoryString(p);
        const statusClass = p.status === "Active" ? "status-active" : "status-inactive";

        let specsRows = "";
        for (const s of specsList) {
            specsRows += `<tr><th>${escapeHtml(s.title)}</th><td>${s.value}</td></tr>`;
        }

        const specsTable = specsList.length > 0
            ? `<h2>Technical Specifications</h2>
               <table class="specs-table"><tbody>${specsRows}</tbody></table>`
            : "";

        return `
            <a class="back" onclick="showSearch()">&larr; Back to results</a>
            <h1>${escapeHtml(p.brand || "")} ${escapeHtml(p.title || "")}</h1>
            <p class="subtitle">${escapeHtml(p.description || "")}</p>

            <div class="quote-box">
                <h2>Quote String</h2>
                <div class="quote-row">
                    <div class="quote-text" id="quote-text">${escapeHtml(quoteString)}</div>
                    <button class="copy-btn" onclick="copyQuote(this)">Copy</button>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <h2>Pricing</h2>
                    <div class="field">
                        <div class="field-label">MSRP</div>
                        <div class="field-value large">${msrp != null ? formatPrice(msrp) : "N/A"}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Currency</div>
                        <div class="field-value">${escapeHtml(currency)}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Status</div>
                        <div class="field-value ${statusClass}">${escapeHtml(p.status || "")}</div>
                    </div>
                    ${p.eolDate ? `<div class="field">
                        <div class="field-label">EOL Date</div>
                        <div class="field-value">${escapeHtml((p.eolDate || "").slice(0, 10))}</div>
                    </div>` : ""}
                </div>

                <div class="info-card">
                    <h2>Identifiers</h2>
                    <div class="field">
                        <div class="field-label">SKU</div>
                        <div class="field-value">${escapeHtml(p.sku || "")}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">VPN</div>
                        <div class="field-value">${escapeHtml(p.vpn || "")}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Order Code</div>
                        <div class="field-value">${escapeHtml(p.orderCode || "")}</div>
                    </div>
                    ${p.upc ? `<div class="field">
                        <div class="field-label">UPC</div>
                        <div class="field-value">${escapeHtml(p.upc)}</div>
                    </div>` : ""}
                    <div class="field">
                        <div class="field-label">Item SKU Info</div>
                        <div class="field-value">${escapeHtml(p.itemSkuInfo || "")}</div>
                    </div>
                </div>

                <div class="info-card">
                    <h2>Product Info</h2>
                    <div class="field">
                        <div class="field-label">Brand</div>
                        <div class="field-value">${escapeHtml(p.brand || "")}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Family</div>
                        <div class="field-value">${escapeHtml(p.family || "")}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Category</div>
                        <div class="field-value">${escapeHtml(category)}</div>
                    </div>
                    <div class="field">
                        <div class="field-label">Model ID</div>
                        <div class="field-value">${escapeHtml(p.modelId || "")}</div>
                    </div>
                    ${p.chassis ? `<div class="field">
                        <div class="field-label">Chassis</div>
                        <div class="field-value">${escapeHtml(p.chassis)}</div>
                    </div>` : ""}
                </div>

                <div class="info-card">
                    <h2>Description</h2>
                    <p class="long-desc">${escapeHtml(p.longDescription || "")}</p>
                </div>
            </div>

            ${specsTable}
        `;
    }

    function copyQuote(btn) {
        const text = document.getElementById("quote-text").innerText;
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = "Copied!";
            btn.classList.add("copied");
            setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
            }, 2000);
        });
    }

    // --- Event binding ---

    document.getElementById("search-btn").addEventListener("click", () => {
        const query = document.getElementById("search-input").value.trim();
        if (query) doSearch(query);
    });

    document.getElementById("search-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            const query = e.target.value.trim();
            if (query) doSearch(query);
        }
    });

    // Focus the search input on load
    document.getElementById("search-input").focus();
    </script>
</body>
</html>
